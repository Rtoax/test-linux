# Test-Linux CI on github
name: CI

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test_linux:
    runs-on: ubuntu-latest
    env:
      MAKE: scripts/make_tl.sh
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt install -y git make sudo
    - name: Test-Linux Config
      run: |
        make gitconfig
        sudo make install
    - name: Test-Linux Info
      run: |
        $MAKE help
        $MAKE version
    - name: Test-Linux Install Depends
      run: |
        $MAKE deps
